[project]
name = "quantgen"
version = "0.1.0"
description = "Synthetic QuantiFi market cases and prosperity3bt-backed strategy evaluation"
requires-python = ">=3.12"
dependencies = [
    "prosperity3bt==0.12.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
quantgen = "quantgen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["slow: runs a full 10,000-tick day through prosperity3bt"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM300"]  # flags `CONSTANT == value` comparisons such as `p3data.LIMITS == before`
