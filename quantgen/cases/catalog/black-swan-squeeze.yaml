id: black-swan-squeeze
title: Black swan squeeze
tier: stress
family: stress
summary: 'The mirror image of the crash: a market-wide spike up of 5-15%.'
description: Every diffusive product jumps up together, with the same liquidity, volatility and IV aftermath as
  the crash. Short positions are squeezed.
references: [Taleb (2007)]
modifiers:
- kind: shock
  products: ['@diffusive']
  size: [0.05, 0.15]
  direction: up
  ramp_ticks: [5, 30]
  hold_ticks: [200, 1000]
  recovery: [0.2, 0.5]
  recovery_ticks: [1000, 3000]
- kind: liquidity_window
  products: ['@all']
  widen: [2, 4]
  volume_factor: 0.4
  level_drop: 0.5
  flow_factor: 2.0
  duration_ticks: [500, 1500]
- kind: vol_window
  products: ['@diffusive']
  factor: [2.0, 3.0]
  duration_ticks: [1000, 2000]
- kind: iv_shock
  size: [0.01, 0.02]
  ramp_ticks: 20
  hold_ticks: 500
  recovery: 0.5
  recovery_ticks: 2000
